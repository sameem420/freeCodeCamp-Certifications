<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>freeCodeCamp - Music Shopping Cart Page Lab</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body>
        <div
            id="shopping-cart-container"
            class="flex flex-col lg:flex-row gap-6 max-w-6xl mx-auto p-6"
        >
            <!-- Products -->
            <div id="products-container" class="flex-1 space-y-4">
                <div class="card p-5 border rounded-lg shadow-sm bg-white">
                    <h2 class="text-xl font-semibold">Midnight Dreams</h2>

                    <p class="quantity mt-2 text-gray-600">Quantity: 2</p>

                    <p class="price mt-1 text-lg font-medium">$29.99</p>

                    <button
                        class="remove-button mt-4 px-4 py-2 rounded-md bg-red-500 hover:bg-red-700 text-white"
                    >
                        Remove
                    </button>
                </div>

                <div class="card p-5 border rounded-lg shadow-sm bg-white">
                    <h2 class="text-xl font-semibold">Electric Horizons</h2>

                    <p class="quantity mt-2 text-gray-600">Quantity: 1</p>

                    <p class="price mt-1 text-lg font-medium">$19.99</p>

                    <button
                        class="remove-button mt-4 px-4 py-2 rounded-md bg-red-500 hover:bg-red-700 text-white"
                    >
                        Remove
                    </button>
                </div>

                <div class="card p-5 border rounded-lg shadow-sm bg-white">
                    <h2 class="text-xl font-semibold">Acoustic Sessions</h2>

                    <p class="quantity mt-2 text-gray-600">Quantity: 3</p>

                    <p class="price mt-1 text-lg font-medium">$24.99</p>

                    <button
                        class="remove-button mt-4 px-4 py-2 rounded-md bg-red-500 hover:bg-red-700 text-white"
                    >
                        Remove
                    </button>
                </div>
            </div>

            <!-- Order Summary -->
            <div
                id="order-summary-container"
                class="w-full lg:w-80 rounded-lg border p-6 bg-gray-50"
            >
                <h2 class="text-2xl font-bold mb-6">Order Summary</h2>

                <div class="flex justify-between">
                    <span id="total" class="font-semibold text-lg"
                        >Total:
                    </span>
                    <span id="total-amount">$129.95</span>
                </div>

                <a
                    href="#"
                    class="block text-center mt-6 px-4 py-3 rounded-lg bg-blue-600 hover:bg-blue-800 text-white font-semibold"
                >
                    Checkout
                </a>
            </div>
        </div>
    </body>
</html>
